# EarningsWatch — local development services
#
# 取代 start.sh 中「docker start || docker run」的命令式降級，改為宣告式服務定義。
# 設計範圍：只管本機所需的 stateful 服務（目前只有 Qdrant）。
# Streamlit 仍以 `streamlit run` 啟動，保留 hot-reload 與 debugger 的開發體驗。
#
# 用法：
#   docker compose up -d qdrant     # 啟動 Qdrant（背景執行；idempotent）
#   docker compose down             # 停止並移除容器（資料保留在 qdrant_storage/）
#   docker compose logs -f qdrant   # 看 Qdrant 即時 log
#
# 部署備註：對外部署請改用 Qdrant Cloud（QDRANT_URL + QDRANT_API_KEY），
# 此檔案僅供本機開發。

services:
  qdrant:
    image: qdrant/qdrant         # 未鎖版本以維持與舊 start.sh 相同行為。需鎖定時改 qdrant/qdrant:v1.X.Y
    container_name: qdrant       # 與舊 docker run --name qdrant 一致：既有 container 與資料卷可無痛接管
    restart: unless-stopped
    ports:
      # [f] 只綁定 127.0.0.1：與舊 start.sh 安全注釋一致；外部無法直接存取 Qdrant admin API
      - "127.0.0.1:6333:6333"
    volumes:
      # 向量資料持久化；路徑與舊 docker run -v 完全一致，原有資料會直接被新容器接管
      - ./qdrant_storage:/qdrant/storage
