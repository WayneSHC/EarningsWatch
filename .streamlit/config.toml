# .streamlit/config.toml
# Streamlit 安全設定

[server]
# 本機開發：127.0.0.1（僅本機）
# 對外部署：改 0.0.0.0，搭配 nginx HTTPS 反向代理
address = "127.0.0.1"
port = 8501
headless = true

# XSRF 保護（預設已啟用，明確設定確保不被覆蓋）
enableXsrfProtection = true

# 不允許跨 origin 存取（對外部署可依需求調整）
enableCORS = false

# [c] 關閉 file watcher 以避免 transformers 的 lazy modules
# （image_processing_*）在 introspect 時噴出大量
# `ModuleNotFoundError: No module named 'torchvision'` 雜訊。
# 我們在 Streamlit Cloud 部署時不需要 hot-reload，關掉同時降低 CPU 用量。
fileWatcherType = "none"

[browser]
# 不回傳使用統計到 Streamlit 伺服器
gatherUsageStats = false

[client]
# 顯示工具列（方便 Demo）
toolbarMode = "auto"
