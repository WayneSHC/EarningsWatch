name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks needs full history to scan all commits on PRs.
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No license needed for public repos; GITLEAKS_LICENSE env can be added
          # later if this repo becomes private + uses org-level Gitleaks.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

  spec-check:
    # Lightweight gate that enforces OpenSpec hygiene on every PR:
    #   1. openspec validate --all     — structural correctness of every spec
    #   2. check_spec_drift.py         — every src/scripts path the specs
    #                                    reference must still exist on disk
    # Runs in parallel with secret-scan; doesn't block `test`.
    name: OpenSpec Validate + Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.3.1

      - name: Validate all specs structurally
        run: openspec validate --specs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check spec ↔ code drift (path references)
        # Pure-stdlib script: no pip install needed.
        run: python scripts/check_spec_drift.py

  test:
    name: Compile + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: secret-scan

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime + dev dependencies
        # Tests stub out network calls, but core modules import these at module load
        # (e.g. tenacity, langgraph). Need both files installed.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Syntax check (py_compile)
        # Catches simple parse errors across the whole src/ tree before running tests.
        # Faster than pytest collection and gives a clean signal for "did the code import".
        run: |
          python -m compileall -q src scripts

      - name: Run unit tests
        # Tests are designed to run without real API keys (network calls are stubbed
        # via monkeypatch). Conftest sets dummy env vars so module-level code paths
        # don't blow up.
        run: |
          pytest tests/ -v --tb=short

      - name: Streamlit smoke test
        # py_compile catches syntax errors but not runtime issues like a misplaced
        # set_page_config() or a broken import order. Boot Streamlit headless and
        # hit /_stcore/script-health-check, which executes the script via
        # does_script_run_without_error() and returns 200 + "ok" only on a clean run.
        env:
          # Module-level code paths read these via os.getenv; tests use the same dummy
          # values in tests/conftest.py.
          OPENAI_API_KEY: test-openai
          GEMINI_API_KEY: test-gemini
        run: |
          set -e
          streamlit run src/ui/app.py \
            --server.port 8501 \
            --server.headless true \
            --server.scriptHealthCheckEnabled true \
            > /tmp/streamlit.log 2>&1 &
          STREAMLIT_PID=$!

          cleanup() { kill "$STREAMLIT_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          # Wait up to 60s for the server to come up; bail early if Streamlit died.
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8501/_stcore/health > /dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$STREAMLIT_PID" 2>/dev/null; then
              echo "Streamlit exited before becoming healthy."
              cat /tmp/streamlit.log
              exit 1
            fi
            sleep 1
          done

          if ! curl -fsS http://localhost:8501/_stcore/health > /dev/null 2>&1; then
            echo "Server health check timed out."
            cat /tmp/streamlit.log
            exit 1
          fi

          status=$(curl -s -o /tmp/script_health.txt \
                       -w "%{http_code}" \
                       http://localhost:8501/_stcore/script-health-check)
          body=$(cat /tmp/script_health.txt)
          if [ "$status" != "200" ] || [ "$body" != "ok" ]; then
            echo "script-health-check failed (HTTP $status, body='$body')."
            cat /tmp/streamlit.log
            exit 1
          fi
          echo "Streamlit smoke test passed."
